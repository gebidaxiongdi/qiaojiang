name: 自动抓取 + ECC导入 + 评分 + 部署
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取 GitHub Skill 数据
        run: python scripts/fetch-github.py

      - name: 抓取补充数据（skills.sh）
        run: python scripts/fetch-extra.py

      - name: 导入 ECC 生态技能（261个）
        run: |
          git clone --depth 1 https://github.com/affaan-m/ECC.git /tmp/ecc
          python scripts/import-ecc-skills.py --ecc-path /tmp/ecc/skills

      - name: 优化分类
        run: python scripts/optimize-categories.py

      - name: 跨平台评分归一化
        run: python scripts/normalize-scores.py

      - name: 提交更新
        run: |
          git config user.name "gebidaxiongdi"
          git config user.email "gebidaxiongdi@users.noreply.github.com"
          git add src/data/skills.json
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "🔄 自动更新 $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: 部署到 Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
