name: 自动抓取 + 部署
on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时
  workflow_dispatch:       # 手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取 GitHub Skill 数据
        run: python scripts/fetch-github.py

      - name: 提交更新
        run: |
          git config user.name "gebidaxiongdi"
          git config user.email "gebidaxiongdi@users.noreply.github.com"
          git add src/data/skills.json
          git diff --quiet && git diff --staged --quiet || git commit -m "🔄 自动更新 Skill 数据 $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: 部署到 Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
